[package]
name = "universe-os"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "universe_host"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

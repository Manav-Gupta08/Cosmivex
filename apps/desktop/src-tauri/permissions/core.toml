[[permission]]
identifier = "allow-core-bridge"
description = "Read native core health and configure its resource profile."
commands.allow = ["subscribe_core", "ack_core", "resync_core", "unsubscribe_core", "set_profile", "set_process_collection", "set_network_collection", "filesystem_root", "filesystem_navigate", "filesystem_stop", "set_recording", "recording_status", "history_sessions", "history_events", "history_checkpoints", "history_checkpoint"]

[[permission]]
identifier = "allow-isolated-qualification"
description = "Run bounded isolated diagnostics only with the host qualification environment opt-in."
commands.allow = ["pressure_run", "pressure_ack"]